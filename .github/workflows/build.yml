name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Go build multi-arch
        run: |
          VERSION="${GITHUB_REF_NAME:-}"
          if [ -z "$VERSION" ]; then
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          mkdir -p dist
          for pair in linux/amd64 linux/arm64; do
            OS="${pair%/*}"
            ARCH="${pair#*/}"
            OUT="dist/monitoring-worker-${OS}-${ARCH}"
            GOOS="$OS" GOARCH="$ARCH" CGO_ENABLED=0 go build -buildvcs=false -trimpath \
              -ldflags "-s -w -X monitoring-worker-go/internal/buildinfo.Version=${VERSION}" \
              -o "$OUT" ./cmd/worker/
          done
          # Backward-compatible name (amd64) for older install docs.
          cp dist/monitoring-worker-linux-amd64 dist/monitoring-worker
          for f in dist/monitoring-worker-linux-amd64 dist/monitoring-worker-linux-arm64; do
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done
          (
            cd dist
            sha256sum monitoring-worker-linux-amd64 monitoring-worker-linux-arm64 > checksums.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: monitoring-worker
          path: |
            dist/monitoring-worker
            dist/monitoring-worker-linux-amd64
            dist/monitoring-worker-linux-amd64.sha256
            dist/monitoring-worker-linux-arm64
            dist/monitoring-worker-linux-arm64.sha256
            dist/checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/monitoring-worker
            dist/monitoring-worker-linux-amd64
            dist/monitoring-worker-linux-amd64.sha256
            dist/monitoring-worker-linux-arm64
            dist/monitoring-worker-linux-arm64.sha256
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Docker tags
        id: dockertags
        run: |
          safe="${GITHUB_REF_NAME//\//-}"
          echo "safe=${safe}" >> "$GITHUB_OUTPUT"
          echo "tag=akeb/monitoring-worker-go:${safe}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 1
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.dockertags.outputs.tag }}
          cache-from: type=gha,scope=monitoring-worker-go-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=monitoring-worker-go-${{ matrix.suffix }}

  merge:
    if: github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-arch manifest
        run: |
          safe="${GITHUB_REF_NAME//\//-}"
          tags=(-t "akeb/monitoring-worker-go:${safe}")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags+=(-t "akeb/monitoring-worker-go:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "akeb/monitoring-worker-go:${safe}-amd64" \
            "akeb/monitoring-worker-go:${safe}-arm64"
