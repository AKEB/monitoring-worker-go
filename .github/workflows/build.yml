name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # нужно для softprops/action-gh-release при push тега v*
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Go build
        run: |
          VERSION="${GITHUB_REF_NAME:-}"
          if [ -z "$VERSION" ]; then
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          go build -buildvcs=false \
            -ldflags "-X monitoring-worker-go/internal/buildinfo.Version=${VERSION}" \
            -v -o monitoring-worker ./cmd/worker/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-worker
          path: monitoring-worker

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: monitoring-worker
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Docker tag (slashes in branch names are not valid in tags)
        id: tag
        run: echo "safe=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            akeb/monitoring-worker-go:${{ steps.tag.outputs.safe }}
            akeb/monitoring-worker-go:latest
